<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  /* ---------- Mobile (added) ---------- */
  @media (max-width: 860px) {
    .sidebar { width: 260px; max-width: 85vw; }
    .sidebar.open { box-shadow: 0 0 0 100vmax rgba(0,0,0,.6); }
    .main { padding: 16px 14px 40px; }
    .main h2 { font-size: 26px; }
    .sub { font-size: 14px; margin: 4px 0 18px; }
    .search { height: 54px; padding: 0 14px; margin-bottom: 22px; }
    .table-wrap { -webkit-overflow-scrolling: touch; }
    table { min-width: 520px; }
    th { padding: 12px 14px; font-size: 13px; }
    td { padding: 12px 14px; font-size: 14px; }
    .modal { padding: 20px; }
    .actions { flex-wrap: wrap; }
    .dept { font-size: 19px; }
  }
  @media (max-width: 860px) { #orderCount { font-size: 16px; min-width: 0; } }
</style>
<title>Production Details - Stock Board</title></head><body data-page="production">
<div class="layout"><aside class="sidebar" id="sidebar"></aside>
<main class="main">

  <h2>Production Details</h2>
  <p class="sub">Calculate component requirements based on company orders.</p>

  <!-- STEP 1: enter number of orders -->
  <div class="search"><i class="fa-solid fa-industry blue"></i>
    <input id="orderCount" type="number" min="1" placeholder="Enter the number of orders received..."></div>

  <!-- STEP 2: result table -->
  <div class="table-wrap"><table>
    <thead>
      <tr>
        <th>Component Name</th>
        <th>Current Stock</th>
        <th>Required Quantity</th>
        <th>Min Order Qty</th>
        <th>Cost (₹)</th>
        <th>Total Cost (₹)</th>
        <th>Expected Date</th>
      </tr>
    </thead>
    <tbody id="prodBody">
      <tr><td colspan="7" style="text-align:center;padding:40px;color:#8b95a7">Enter the number of orders above to calculate requirements.</td></tr>
    </tbody>
  </table></div>

</main></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="main.js"></script>

<script>
(function () {

  var COLLECTION = "components";   // Firestore collection name

  /* =====================================================
     FORMULAS  (change only these two if needed)
     ===================================================== */

  // Required Quantity = Orders - Current Stock
  function calcRequired(orders, stock) {
    return orders - stock;
  }

  // Total Cost = higher of (Required Quantity, Min Order Qty) x Cost
  function calcTotal(required, minQty, cost) {
    return Math.max(required, minQty) * cost;
  }

  /* ===================================================== */


  var body  = document.getElementById("prodBody");
  var comps = [];

  /* Replace the input with a clone so old listeners from main.js are removed */
  var oldInput = document.getElementById("orderCount");
  var input = oldInput.cloneNode(true);
  oldInput.parentNode.replaceChild(input, oldInput);


  /* ---------- Helpers ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function money(n) {
    return "₹" + Number(n).toFixed(2);
  }

  function dateAfter(days) {
    var d = new Date();
    d.setDate(d.getDate() + (Number(days) || 0));
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  }

  function message(html, color, size) {
    body.innerHTML =
      '<tr><td colspan="7" style="text-align:center;padding:40px;color:' + color + ';font-size:' + (size || 15) + 'px">' +
      html + "</td></tr>";
  }


  /* ---------- Main calculation ---------- */
  function render() {
    var orders = parseInt(input.value, 10);

    // Nothing typed
    if (!orders || orders < 1) {
      message("Enter the number of orders above to calculate requirements.", "#8b95a7");
      return;
    }

    var rows  = [];
    var grand = 0;

    comps.forEach(function (c) {
      var stock  = Number(c.stock)  || 0;
      var minQty = Number(c.minQty) || 0;
      var cost   = Number(c.cost)   || 0;

      var required = calcRequired(orders, stock);

      // Orders not more than stock -> do not show this component
      if (required <= 0) return;

      var total = calcTotal(required, minQty, cost);
      grand += total;

      rows.push(
        "<tr>" +
          '<td style="font-weight:600">' + esc(c.name) + "</td>" +
          '<td style="text-align:right">' + stock + "</td>" +
          '<td style="text-align:right;color:#f5822a;font-weight:700">' + required + "</td>" +
          '<td style="text-align:right;color:#8b95a7">' + minQty + "</td>" +
          '<td style="text-align:right;color:#8b95a7">' + money(cost) + "</td>" +
          '<td style="text-align:right;color:#ff4d4f;font-weight:700">' + money(total) + "</td>" +
          "<td>" + dateAfter(c.delivery) + "</td>" +
        "</tr>"
      );
    });

    // Enough stock for every component
    if (!rows.length) {
      message(
        '<i class="fa-solid fa-circle-check"></i> Sufficient stock available for all components. No orders required.',
        "#2fb344", 18
      );
      return;
    }

    // Grand total row
    rows.push(
      '<tr style="background:rgba(255,255,255,.03)">' +
        '<td colspan="5" style="text-align:right;font-weight:700;color:#fff;padding:18px 16px">Grand Total Estimated Cost:</td>' +
        '<td style="text-align:right;font-weight:800;font-size:20px;color:#ff4d4f;padding:18px 16px">' + money(grand) + "</td>" +
        "<td></td>" +
      "</tr>"
    );

    body.innerHTML = rows.join("");
  }


  /* ---------- Events ---------- */
  input.addEventListener("input", render);

  firebase.firestore().collection(COLLECTION).onSnapshot(function (snap) {
    comps = snap.docs.map(function (d) { return d.data(); });
    render();
  }, function (err) {
    console.error("Could not load components:", err);
    message("Could not load components. Check the console for details.", "#ff4d4f");
  });

})();
</script>

<!-- SIDEBAR "Orders" BADGE = number of active orders (added) -->
<script>
(function () {
  var activeOrderCount = null;
  try {
    var cachedCount = localStorage.getItem("sb_orders_count_v1");
    if (cachedCount !== null) activeOrderCount = Number(cachedCount);
  } catch (e) {}
  var sidebarObserver = null;
  var sb = document.getElementById("sidebar");

  function findOrdersBadge() {
    if (!sb) return null;
    var all = sb.querySelectorAll("*");
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (el.children.length !== 0) continue;               // only leaf elements
      var t = el.textContent.trim();
      var cls = (el.className && el.className.toString()) || "";
      var looksLikeBadge = t === "undefined" || /^\d+$/.test(t) || /badge|count|pill/i.test(cls);
      if (!looksLikeBadge) continue;
      var p1 = el.parentElement;
      var p2 = p1 ? p1.parentElement : null;
      var near = (p1 && p1 !== sb && /orders/i.test(p1.textContent)) ||
                 (p2 && p2 !== sb && /orders/i.test(p2.textContent));
      if (near) return el;
    }
    return null;
  }

  function applyOrderBadge() {
    if (activeOrderCount === null) return;
    var badge = findOrdersBadge();
    if (badge && badge.textContent.trim() !== String(activeOrderCount)) {
      badge.textContent = activeOrderCount;
    }
  }

  if (sb) {
    sidebarObserver = new MutationObserver(function () {
      sidebarObserver.disconnect();
      applyOrderBadge();
      sidebarObserver.observe(sb, { childList: true, subtree: true, characterData: true });
    });
    sidebarObserver.observe(sb, { childList: true, subtree: true, characterData: true });
  }
  applyOrderBadge();

  firebase.firestore().collection("orders").onSnapshot(function (snap) {
    activeOrderCount = snap.size;
    try { localStorage.setItem("sb_orders_count_v1", String(snap.size)); } catch (e) {}
    applyOrderBadge();
  });
})();
</script>
<!-- MOBILE (added): tap outside the menu to close it -->
<script>
document.addEventListener("click", function (e) {
  var sb = document.getElementById("sidebar");
  if (!sb || !sb.classList.contains("open")) return;
  if (sb.contains(e.target) || (e.target.closest && e.target.closest("#menuBtn"))) return;
  sb.classList.remove("open");
});
</script>

</body></html>
