<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    /* ---------- Dashboard layout (scoped, does not touch other pages) ---------- */
    .d-hero, .d-stat, .d-alerts {
      background: #161b22;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      font-family: 'Inter', sans-serif;
    }

    /* Hero */
    .d-hero { padding: 32px; margin-top: 28px; }
    .d-hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      flex-wrap: wrap;
    }
    .d-big {
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
      color: #ff4d4f;
      margin-bottom: 14px;
    }
    .d-big.zero { color: #2dd4bf; }
    .d-label { font-size: 18px; color: #d7dde8; }
    .d-right { text-align: right; font-size: 14px; color: #8b95a7; }
    .d-right strong {
      display: block;
      margin-top: 4px;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
    }

    /* Timeline */
    .d-timeline { margin-top: 32px; }
    .d-track {
      height: 6px;
      border-radius: 99px;
      background: #2a2f3a;
      overflow: hidden;
    }
    .d-fill {
      height: 100%;
      width: 0;
      border-radius: 99px;
      background: #ff4d4f;
      transition: width .4s ease;
    }
    .d-ticks {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 12px;
      color: #8b95a7;
    }

    /* Stat cards */
    .d-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 24px;
    }
    .d-stat { padding: 20px; }
    .d-stat b {
      display: block;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    .d-stat span { font-size: 14px; color: #8b95a7; }
    .d-stat.red b    { color: #ff4d4f; }
    .d-stat.orange b { color: #f5822a; }
    .d-stat.teal b   { color: #2dd4bf; }

    /* Stock alerts */
    .d-section {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin: 32px 0 14px;
    }
    .d-alerts { overflow: hidden; }
    .d-alert-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
    }
    .d-alert-row + .d-alert-row { border-top: 1px solid rgba(255,255,255,.08); }
    .d-alert-left { display: flex; align-items: center; gap: 12px; font-size: 16px; }
    .d-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ff4d4f;
      box-shadow: 0 0 8px rgba(255,77,79,.8);
      flex-shrink: 0;
    }
    .d-dept { color: #8b95a7; }
    .d-name { color: #fff; font-weight: 700; }
    .d-alert-right { display: flex; align-items: center; gap: 16px; font-size: 14px; color: #8b95a7; }
    .d-alert-right .cur { color: #ff4d4f; font-weight: 700; font-size: 18px; }
    .d-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 8px;
      background: #232a35;
      border: 1px solid rgba(255,255,255,.06);
      color: #9aa4b5;
      font-size: 13px;
    }
    .d-empty { padding: 24px; text-align: center; color: #2fb344; font-size: 15px; }

    @media (max-width: 900px) {
      .d-stats { grid-template-columns: repeat(2, 1fr); }
      .d-right { text-align: left; }
    }
  /* ---------- Mobile (added) ---------- */
  @media (max-width: 860px) {
    .sidebar { width: 260px; max-width: 85vw; }
    .sidebar.open { box-shadow: 0 0 0 100vmax rgba(0,0,0,.6); }
    .main { padding: 16px 14px 40px; }
    .main h2 { font-size: 26px; }
    .sub { font-size: 14px; margin: 4px 0 18px; }
    .search { height: 54px; padding: 0 14px; margin-bottom: 22px; }
    .table-wrap { -webkit-overflow-scrolling: touch; }
    table { min-width: 520px; }
    th { padding: 12px 14px; font-size: 13px; }
    td { padding: 12px 14px; font-size: 14px; }
    .modal { padding: 20px; }
    .actions { flex-wrap: wrap; }
    .dept { font-size: 19px; }
  }

  @media (max-width: 860px) {
    .d-hero { padding: 20px; margin-top: 18px; }
    .d-big { font-size: 48px; margin-bottom: 10px; }
    .d-label { font-size: 16px; }
    .d-right strong { font-size: 22px; }
    .d-timeline { margin-top: 24px; }
    .d-ticks { font-size: 11px; }
    .d-stats { gap: 12px; margin-top: 16px; }
    .d-stat { padding: 14px; }
    .d-stat b { font-size: 22px; }
    .d-stat span { font-size: 13px; }
    .d-section { margin-top: 24px; font-size: 17px; }
    .d-alert-row { flex-direction: column; align-items: flex-start; padding: 14px 16px; gap: 10px; }
    .d-alert-left { font-size: 15px; flex-wrap: wrap; }
    .d-alert-right { flex-wrap: wrap; gap: 10px; }
  }
  </style>

  <title>Dashboard - Stock Board</title>
</head>

<body data-page="dashboard">

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <h2>Dashboard</h2>
    <p class="sub">Live status of every part in the device.</p>

    <!-- HERO CARD -->
    <section class="d-hero">
      <div class="d-hero-top">
        <div>
          <div class="d-big" id="bigCount">0</div>
          <div class="d-label">components need to be ordered immediately.</div>
        </div>
        <div class="d-right">
          Order today, longest part lands
          <strong id="longest">N/A</strong>
        </div>
      </div>

      <!-- TIMELINE -->
      <div class="d-timeline">
        <div class="d-track"><div class="d-fill" id="fill"></div></div>
        <div class="d-ticks">
          <span id="t0"></span>
          <span id="t15">+15 days</span>
          <span id="t30">+30 days</span>
          <span id="t45">+45 days</span>
        </div>
      </div>
    </section>

    <!-- STAT CARDS -->
    <section class="d-stats">
      <div class="d-stat"><b id="sTotal">0</b><span>Components tracked</span></div>
      <div class="d-stat red"><b id="sCrit">0</b><span>Order Now</span></div>
      <div class="d-stat orange"><b id="sLow">0</b><span>Getting Low</span></div>
      <div class="d-stat teal"><b id="sOk">0</b><span>In Stock</span></div>
    </section>

    <!-- STOCK ALERTS -->
    <h3 class="d-section">Stock Alerts</h3>
    <div class="d-alerts" id="alerts">
      <div class="d-empty">Nothing waiting on a purchase order right now.</div>
    </div>

  </main>
</div>

<!-- INSTANT SHOW (added): show the last saved numbers immediately, then update live -->
<script>
(function () {
  try {
    var c = JSON.parse(localStorage.getItem("sb_dashboard_cache_v1") || "null");
    if (!c) return;
    var fillEl = document.getElementById("fill");
    fillEl.style.transition = "none";

    var big = document.getElementById("bigCount");
    big.textContent = c.critical;
    big.classList.toggle("zero", c.critical === 0);

    document.getElementById("sTotal").textContent = c.total;
    document.getElementById("sCrit").textContent  = c.critical;
    document.getElementById("sLow").textContent   = c.low;
    document.getElementById("sOk").textContent    = c.ok;

    if (c.critical > 0) {
      var d = new Date();
      d.setDate(d.getDate() + (c.longestDays || 0));
      document.getElementById("longest").textContent =
        d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
    }
    fillEl.style.width = c.fill || "0%";
    if (c.alertsHtml) document.getElementById("alerts").innerHTML = c.alertsHtml;

    setTimeout(function () { fillEl.style.transition = ""; }, 60);
  } catch (e) {}
})();
</script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<!-- FASTER LOAD (added): keep a local copy of the data so it appears at once -->
<script>
(function () {
  try {
    firebase.firestore().enablePersistence({ synchronizeTabs: true }).catch(function () {});
  } catch (e) {}
})();
</script>
<script src="main.js"></script>

<!-- DASHBOARD DATA -->
<script>
document.addEventListener("DOMContentLoaded", function () {

  const db = firebase.firestore();
  const TIMELINE_DAYS = 45;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmt(d) {
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  }

  function daysFromToday(n) {
    const d = new Date();
    d.setDate(d.getDate() + n);
    return d;
  }

  /* Same status rule as the Components page (gap = Stock - Min Qty):
       stock below min (gap < 0)  -> Order now
       gap 0 to 15                -> Getting low
       gap above 15               -> In Stock                              */
  function getStatus(stock, minQty) {
    const gap = stock - minQty;
    if (gap < 0) return "order";
    if (gap <= 15) return "low";
    return "ok";
  }

  /* First tick = today's date */
  document.getElementById("t0").textContent = fmt(new Date());


  /* ---------- SIDEBAR "Orders" BADGE = number of active orders ---------- */
  let activeOrderCount = null;
  try {
    const cachedCount = localStorage.getItem("sb_orders_count_v1");
    if (cachedCount !== null) activeOrderCount = Number(cachedCount);
  } catch (e) {}
  let sidebarObserver = null;

  function findOrdersBadge() {
    const sb = document.getElementById("sidebar");
    if (!sb) return null;
    const all = sb.querySelectorAll("*");
    for (let i = 0; i < all.length; i++) {
      const el = all[i];
      if (el.children.length !== 0) continue;               // only leaf elements
      const t = el.textContent.trim();
      const cls = (el.className && el.className.toString()) || "";
      const looksLikeBadge = t === "undefined" || /^\d+$/.test(t) || /badge|count|pill/i.test(cls);
      if (!looksLikeBadge) continue;
      const p1 = el.parentElement;
      const p2 = p1 ? p1.parentElement : null;
      const near = (p1 && p1 !== sb && /orders/i.test(p1.textContent)) ||
                   (p2 && p2 !== sb && /orders/i.test(p2.textContent));
      if (near) return el;
    }
    return null;
  }

  function applyOrderBadge() {
    if (activeOrderCount === null) return;
    const badge = findOrdersBadge();
    if (badge && badge.textContent.trim() !== String(activeOrderCount)) {
      badge.textContent = activeOrderCount;
    }
  }

  const sb = document.getElementById("sidebar");
  if (sb) {
    sidebarObserver = new MutationObserver(function () {
      sidebarObserver.disconnect();
      applyOrderBadge();
      sidebarObserver.observe(sb, { childList: true, subtree: true, characterData: true });
    });
    sidebarObserver.observe(sb, { childList: true, subtree: true, characterData: true });
  }
  applyOrderBadge();

  db.collection("orders").onSnapshot(function (snap) {
    activeOrderCount = snap.size;
    try { localStorage.setItem("sb_orders_count_v1", String(snap.size)); } catch (e) {}
    applyOrderBadge();
  });
  /* ---------------------------------------------------------------------- */


  db.collection("components").onSnapshot(function (snapshot) {

    /* an empty copy from the phone's own cache is not real data - wait for the server */
    if (snapshot.empty && snapshot.metadata && snapshot.metadata.fromCache) return;

    let total = 0, critical = 0, low = 0, ok = 0;
    let alerts = [];
    let longestDays = 0;

    snapshot.forEach(function (doc) {
      const data = doc.data();
      total++;

      const stock    = Number(data.stock)    || 0;
      const minQty   = Number(data.minQty)   || 0;
      const delivery = Number(data.delivery) || 0;

      const status = getStatus(stock, minQty);

      if (status === "order") {
        critical++;
        alerts.push({
          name: data.name || "Unnamed component",
          dept: data.dept || "",
          stock: stock,
          minQty: minQty,
          delivery: delivery
        });
        if (delivery > longestDays) longestDays = delivery;
      } else if (status === "low") {
        low++;
      } else {
        ok++;
      }
    });

    /* Numbers */
    const big = document.getElementById("bigCount");
    big.textContent = critical;
    big.classList.toggle("zero", critical === 0);

    document.getElementById("sTotal").textContent = total;
    document.getElementById("sCrit").textContent  = critical;
    document.getElementById("sLow").textContent   = low;
    document.getElementById("sOk").textContent    = ok;

    /* Longest delivery date + timeline bar */
    const fill = document.getElementById("fill");
    let fillWidth = "0%";
    if (critical > 0) {
      document.getElementById("longest").textContent = fmt(daysFromToday(longestDays));
      fillWidth = Math.min(100, (longestDays / TIMELINE_DAYS) * 100) + "%";
    } else {
      document.getElementById("longest").textContent = "N/A";
    }
    fill.style.width = fillWidth;

    /* Stock alerts */
    const box = document.getElementById("alerts");

    const alertsHtml = alerts.length
      ? alerts.map(function (a) {
          return `
        <div class="d-alert-row">
          <div class="d-alert-left">
            <span class="d-dot"></span>
            <span>
              ${a.dept ? `<span class="d-dept">[${esc(a.dept)}]</span> ` : ""}<span class="d-name">${esc(a.name)}</span>
            </span>
          </div>
          <div class="d-alert-right">
            <span>Stock: <span class="cur">${a.stock}</span> / ${a.minQty}</span>
            <span class="d-badge"><i class="fa-solid fa-truck"></i> ${a.delivery} days</span>
          </div>
        </div>`;
        }).join("")
      : '<div class="d-empty">Nothing waiting on a purchase order right now.</div>';

    box.innerHTML = alertsHtml;

    /* save for instant show next time */
    try {
      localStorage.setItem("sb_dashboard_cache_v1", JSON.stringify({
        total: total, critical: critical, low: low, ok: ok,
        longestDays: longestDays, fill: fillWidth, alertsHtml: alertsHtml
      }));
    } catch (e) {}
  });

});
</script>

<!-- MOBILE (added): tap outside the menu to close it -->
<script>
document.addEventListener("click", function (e) {
  var sb = document.getElementById("sidebar");
  if (!sb || !sb.classList.contains("open")) return;
  if (sb.contains(e.target) || (e.target.closest && e.target.closest("#menuBtn"))) return;
  sb.classList.remove("open");
});
</script>

</body>
</html>
